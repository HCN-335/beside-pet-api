# Deploys on every push to main: build the arm64 image, push it to ECR, then
# tell the app host to pull and restart itself over SSM. Auth is OIDC — the
# besidepet-ci role trusts this repository's main branch, so no AWS keys are
# stored in GitHub.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR: 765899425598.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE: beside-pet-api
  INSTANCE_ID: i-017447a758c5d0fba
  HEALTH_URL: https://d15ettyoui1eeh.cloudfront.net/v1/health

jobs:
  deploy:
    # arm64 runner — native build for the t4g host, no emulation.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::765899425598:role/besidepet-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin $ECR

      - name: Build and push (sha + latest)
        run: |
          docker build -t $ECR/$IMAGE:${{ github.sha }} -t $ECR/$IMAGE:latest .
          docker push $ECR/$IMAGE:${{ github.sha }}
          docker push $ECR/$IMAGE:latest

      - name: Deploy over SSM and wait
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/opt/besidepet/deploy.sh"]' \
            --timeout-seconds 300 \
            --query 'Command.CommandId' --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID \
              --instance-id $INSTANCE_ID --query 'Status' --output text)
            [ "$STATUS" = "Success" ] && exit 0
            case "$STATUS" in Failed|Cancelled|TimedOut) \
              aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID \
                --query 'StandardErrorContent' --output text; exit 1;; esac
            sleep 5
          done
          echo "deploy did not finish in time"; exit 1

      - name: Health check
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 $HEALTH_URL
